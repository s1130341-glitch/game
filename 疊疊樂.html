<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 疊疊樂 · 治癒堆疊</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: white;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }
        #score {
            font-size: 32px;
            font-weight: 800;
            color: #ffd966;
            text-shadow: 0 0 20px rgba(255,220,100,0.5);
            letter-spacing: 1px;
            line-height: 1.2;
        }
        #height-label {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #best {
            font-size: 16px;
            color: #aaa;
            margin-top: 4px;
            font-weight: 400;
        }
        #instruction {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 20px;
            font-weight: 600;
            text-shadow: 0 2px 10px black;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.5), transparent);
            padding: 15px 0;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20,20,30,0.9);
            backdrop-filter: blur(20px);
            padding: 40px 60px;
            border-radius: 40px;
            text-align: center;
            border: 2px solid rgba(255,100,100,0.6);
            box-shadow: 0 0 60px rgba(255,50,50,0.3);
            display: none;
            z-index: 20;
            pointer-events: auto;
        }
        #gameover h1 {
            font-size: 48px;
            margin: 0 0 10px;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255,80,80,0.5);
        }
        #gameover p {
            font-size: 24px;
            margin: 10px 0 30px;
            color: #ddd;
        }
        #gameover button {
            background: #ffd966;
            border: none;
            color: #222;
            font-size: 24px;
            font-weight: 800;
            padding: 16px 48px;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(255,220,100,0.3);
            letter-spacing: 2px;
        }
        #gameover button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255,220,100,0.5);
        }
        #perfect-badge {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: #ffd966;
            text-shadow: 0 0 40px #ffaa00, 0 0 80px #ff8800;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.3s;
            white-space: nowrap;
            letter-spacing: 8px;
        }
        #combo {
            position: absolute;
            top: 120px;
            left: 20px;
            font-size: 24px;
            color: #ffaa00;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 1px solid #ffaa0055;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #fff;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">載入中...</div>
    <div id="info">
        <div id="height-label">高度</div>
        <div id="score">0</div>
        <div id="best">最高分: 0</div>
    </div>
    <div id="combo">🔥 完美連擊 x2</div>
    <div id="perfect-badge">完美!</div>
    <div id="instruction">點擊畫面 / 空白鍵 放下方塊</div>
    <div id="gameover">
        <h1>遊戲結束</h1>
        <p>你的高度: <span id="final-score">0</span></p>
        <button id="restart-btn">再來一局</button>
    </div>

    <!-- 載入 Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.getElementById('loading').textContent = '載入失敗，請重新整理頁面';
            var script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            script.onload = function() {
                document.getElementById('loading').textContent = '載入完成，啟動中...';
                startGame();
            };
            script.onerror = function() {
                document.getElementById('loading').textContent = '無法載入 Three.js，請檢查網路連線';
            };
            document.head.appendChild(script);
        } else {
            document.getElementById('loading').style.display = 'none';
            startGame();
        }

        function startGame() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initGame);
            } else {
                initGame();
            }
        }

        function initGame() {
            document.getElementById('loading').style.display = 'none';

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            scene.fog = new THREE.Fog(0x111122, 30, 80);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(8, 12, 18);
            camera.lookAt(0, 4, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 相機控制
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraAngle = { theta: 0.6, phi: 1.0 };
            let cameraDistance = 22;
            let cameraTarget = new THREE.Vector3(0, 4, 0);

            function updateCamera() {
                const x = cameraTarget.x + cameraDistance * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
                const y = cameraTarget.y + cameraDistance * Math.cos(cameraAngle.phi);
                const z = cameraTarget.z + cameraDistance * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
                camera.position.set(x, y, z);
                camera.lookAt(cameraTarget);
            }

            updateCamera();

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                cameraAngle.theta -= deltaX * 0.005;
                cameraAngle.phi -= deltaY * 0.005;
                cameraAngle.phi = Math.max(0.4, Math.min(1.5, cameraAngle.phi));
                updateCamera();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            renderer.domElement.addEventListener('wheel', (e) => {
                cameraDistance += e.deltaY * 0.01;
                cameraDistance = Math.max(12, Math.min(40, cameraDistance));
                updateCamera();
            });

            renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            renderer.domElement.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                e.preventDefault();
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                cameraAngle.theta -= deltaX * 0.005;
                cameraAngle.phi -= deltaY * 0.005;
                cameraAngle.phi = Math.max(0.4, Math.min(1.5, cameraAngle.phi));
                updateCamera();
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            renderer.domElement.addEventListener('touchend', () => {
                isDragging = false;
            });

            // 燈光
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            dirLight.receiveShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            const d = 30;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 60;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const fillLight = new THREE.PointLight(0x4466ff, 0.5);
            fillLight.position.set(-5, 10, 15);
            scene.add(fillLight);

            const bottomLight = new THREE.PointLight(0x44aaff, 0.3);
            bottomLight.position.set(0, -2, 5);
            scene.add(bottomLight);

            // 背景星星
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 2000;
            const starPositions = new Float32Array(starsCount * 3);
            for (let i = 0; i < starsCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 400;
                starPositions[i+1] = (Math.random() - 0.5) * 200 + 30;
                starPositions[i+2] = (Math.random() - 0.5) * 400 - 100;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.6 });
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            // 遊戲參數
            const BASE_BLOCK_SIZE = 2.5;
            const BLOCK_HEIGHT = 0.8;
            const MOVING_SPEED = 0.02;
            const MAX_SPEED = 0.055;
            const PERFECT_THRESHOLD = 0.08;

            let score = 0;
            let bestScore = localStorage.getItem('stack3dBest') ? parseInt(localStorage.getItem('stack3dBest')) : 0;
            let combo = 0;
            let isGameOver = false;
            let isMoving = false;

            const towerBlocks = [];
            let currentBlock = null;
            const fragments = [];
            const particleSystems = [];

            function getRandomColor() {
                const hue = Math.random();
                const saturation = 0.7 + Math.random() * 0.3;
                const lightness = 0.6 + Math.random() * 0.3;
                return new THREE.Color().setHSL(hue, saturation, lightness);
            }

            function createBlockMesh(width, depth, color, yPos, xPos = 0, zPos = 0) {
                const geometry = new THREE.BoxGeometry(width, BLOCK_HEIGHT, depth);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color.clone().multiplyScalar(0.2),
                    roughness: 0.3,
                    metalness: 0.1
                });
                const cube = new THREE.Mesh(geometry, material);
                cube.castShadow = true;
                cube.receiveShadow = true;
                cube.position.set(xPos, yPos, zPos);
                return cube;
            }

            function initTower() {
                towerBlocks.forEach(item => scene.remove(item.mesh));
                towerBlocks.length = 0;

                fragments.forEach(f => scene.remove(f.mesh));
                fragments.length = 0;
                particleSystems.forEach(p => scene.remove(p.points));
                particleSystems.length = 0;

                if (currentBlock && currentBlock.mesh) {
                    scene.remove(currentBlock.mesh);
                    currentBlock = null;
                }

                const baseSize = BASE_BLOCK_SIZE;
                const baseColor = new THREE.Color(0x4a90e2);
                const baseY = BLOCK_HEIGHT / 2;
                const baseMesh = createBlockMesh(baseSize, baseSize, baseColor, baseY, 0, 0);
                scene.add(baseMesh);

                towerBlocks.push({
                    mesh: baseMesh,
                    size: { x: baseSize, z: baseSize },
                    pos: { x: 0, y: baseY, z: 0 }
                });

                score = 0;
                combo = 0;
                isGameOver = false;
                document.getElementById('score').textContent = '0';
                document.getElementById('gameover').style.display = 'none';
                document.getElementById('instruction').style.opacity = '1';
                document.getElementById('combo').style.opacity = '0';

                cameraTarget.set(0, 4, 0);
                cameraAngle = { theta: 0.6, phi: 1.0 };
                cameraDistance = 22;
                updateCamera();

                spawnNewBlock();
            }

            // --- 修正：方塊移動方向 ---
            function spawnNewBlock() {
                if (isGameOver) return;

                const topBlock = towerBlocks[towerBlocks.length - 1];
                const topY = topBlock.pos.y;
                const topSize = topBlock.size;

                const newWidth = topSize.x;
                const newDepth = topSize.z;
                const newY = topY + BLOCK_HEIGHT;

                const axis = Math.random() < 0.5 ? 'x' : 'z';
                // 隨機決定從正方向或負方向進來
                const direction = Math.random() < 0.5 ? 1 : -1;

                // 起始位置偏移：從遠處進來
                const startOffset = axis === 'x' ? newWidth * 1.8 : newDepth * 1.8;

                let initX = topBlock.pos.x;
                let initZ = topBlock.pos.z;

                if (axis === 'x') {
                    // 如果 direction = 1，方塊從正 X 方向進來，初始位置在右側
                    // 如果 direction = -1，方塊從負 X 方向進來，初始位置在左側
                    initX = topBlock.pos.x + direction * startOffset;
                } else {
                    initZ = topBlock.pos.z + direction * startOffset;
                }

                const color = getRandomColor();
                const mesh = createBlockMesh(newWidth, newDepth, color, newY, initX, initZ);
                scene.add(mesh);

                const speedFactor = Math.min(MAX_SPEED, MOVING_SPEED + score * 0.0015);
                // 速度方向：與初始位置相反，讓方塊朝著塔中心移動
                // 如果從右側進來 (direction = 1)，應該向左移動 (速度為負)
                // 如果從左側進來 (direction = -1)，應該向右移動 (速度為正)
                const speed = -direction * speedFactor;

                currentBlock = {
                    mesh: mesh,
                    axis: axis,
                    direction: direction,
                    speed: speed,
                    size: { x: newWidth, z: newDepth },
                    baseY: newY,
                    maxDistance: Math.max(newWidth, newDepth) * 2.5
                };

                isMoving = true;
            }

            function placeBlock() {
                if (!currentBlock || !isMoving || isGameOver) return;

                isMoving = false;

                const topBlock = towerBlocks[towerBlocks.length - 1];
                const topPos = topBlock.pos;
                const topSize = topBlock.size;

                const movingMesh = currentBlock.mesh;
                const movingPos = movingMesh.position.clone();
                const movingSize = currentBlock.size;
                const axis = currentBlock.axis;

                let delta = 0;
                let overlap = 0;
                let newSize = { x: movingSize.x, z: movingSize.z };
                let newPos = { x: movingPos.x, y: movingPos.y, z: movingPos.z };

                if (axis === 'x') {
                    delta = movingPos.x - topPos.x;
                    const overlapX = Math.max(0, movingSize.x - Math.abs(delta));
                    overlap = overlapX;
                    newSize.x = overlapX;
                    if (overlapX > 0) {
                        const left1 = topPos.x - topSize.x / 2;
                        const right1 = topPos.x + topSize.x / 2;
                        const left2 = movingPos.x - movingSize.x / 2;
                        const right2 = movingPos.x + movingSize.x / 2;
                        const overlapLeft = Math.max(left1, left2);
                        const overlapRight = Math.min(right1, right2);
                        newPos.x = (overlapLeft + overlapRight) / 2;
                    } else {
                        newPos.x = movingPos.x;
                    }
                    newPos.z = topPos.z;
                } else {
                    delta = movingPos.z - topPos.z;
                    const overlapZ = Math.max(0, movingSize.z - Math.abs(delta));
                    overlap = overlapZ;
                    newSize.z = overlapZ;
                    if (overlapZ > 0) {
                        const front1 = topPos.z - topSize.z / 2;
                        const back1 = topPos.z + topSize.z / 2;
                        const front2 = movingPos.z - movingSize.z / 2;
                        const back2 = movingPos.z + movingSize.z / 2;
                        const overlapFront = Math.max(front1, front2);
                        const overlapBack = Math.min(back1, back2);
                        newPos.z = (overlapFront + overlapBack) / 2;
                    } else {
                        newPos.z = movingPos.z;
                    }
                    newPos.x = topPos.x;
                }

                if (overlap <= 0.01) {
                    gameOver(movingMesh);
                    return;
                }

                const isPerfect = Math.abs(delta) < PERFECT_THRESHOLD;

                if (isPerfect) {
                    combo++;
                    score += 2 + Math.floor(combo / 3);
                    showPerfectEffect();
                } else {
                    combo = 0;
                    score += 1;
                }

                document.getElementById('score').textContent = score;

                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('stack3dBest', bestScore);
                    document.getElementById('best').textContent = `最高分: ${bestScore}`;
                }

                scene.remove(movingMesh);

                const finalY = movingPos.y;
                const finalColor = movingMesh.material.color.clone();
                const finalWidth = newSize.x;
                const finalDepth = newSize.z;

                const newMesh = createBlockMesh(finalWidth, finalDepth, finalColor, finalY, newPos.x, newPos.z);
                scene.add(newMesh);

                towerBlocks.push({
                    mesh: newMesh,
                    size: { x: finalWidth, z: finalDepth },
                    pos: { x: newPos.x, y: finalY, z: newPos.z }
                });

                // 碎片效果
                if (Math.abs(delta) > 0.01 && overlap > 0) {
                    let fragmentWidth, fragmentDepth, fragmentX, fragmentZ;
                    if (axis === 'x') {
                        fragmentWidth = movingSize.x - overlap;
                        fragmentDepth = movingSize.z;
                        const fragmentCenterX = movingPos.x + (delta > 0 ? (movingSize.x/2 - fragmentWidth/2) : (-movingSize.x/2 + fragmentWidth/2));
                        fragmentX = fragmentCenterX;
                        fragmentZ = movingPos.z;
                    } else {
                        fragmentWidth = movingSize.x;
                        fragmentDepth = movingSize.z - overlap;
                        const fragmentCenterZ = movingPos.z + (delta > 0 ? (movingSize.z/2 - fragmentDepth/2) : (-movingSize.z/2 + fragmentDepth/2));
                        fragmentX = movingPos.x;
                        fragmentZ = fragmentCenterZ;
                    }

                    if (fragmentWidth > 0.1 && fragmentDepth > 0.1) {
                        const fragColor = movingMesh.material.color.clone();
                        const fragGeo = new THREE.BoxGeometry(fragmentWidth, BLOCK_HEIGHT, fragmentDepth);
                        const fragMat = new THREE.MeshStandardMaterial({
                            color: fragColor,
                            emissive: fragColor.clone().multiplyScalar(0.2),
                            roughness: 0.4,
                            metalness: 0.1
                        });
                        const fragMesh = new THREE.Mesh(fragGeo, fragMat);
                        fragMesh.castShadow = true;
                        fragMesh.receiveShadow = true;
                        fragMesh.position.set(fragmentX, finalY, fragmentZ);
                        scene.add(fragMesh);

                        fragments.push({
                            mesh: fragMesh,
                            velocity: new THREE.Vector3(
                                (Math.random() - 0.5) * 0.1,
                                -0.05 - Math.random() * 0.1,
                                (Math.random() - 0.5) * 0.1
                            ),
                            rotationSpeed: new THREE.Vector3(
                                (Math.random() - 0.5) * 0.1,
                                (Math.random() - 0.5) * 0.1,
                                (Math.random() - 0.5) * 0.1
                            ),
                            life: 1.0
                        });

                        createParticles(fragmentX, finalY, fragmentZ, fragColor, 8);
                    }
                }

                if (isPerfect) {
                    createParticles(newPos.x, finalY + 0.5, newPos.z, new THREE.Color(0xffd966), 20);
                } else {
                    createParticles(newPos.x, finalY, newPos.z, new THREE.Color(0x88aaff), 5);
                }

                const targetY = Math.max(4, topBlock.pos.y + 3);
                const startTarget = cameraTarget.clone();
                const endTarget = new THREE.Vector3(topBlock.pos.x, targetY, topBlock.pos.z);
                let progress = 0;
                const duration = 300;
                const startTime = performance.now();

                function animateCameraTarget() {
                    const elapsed = performance.now() - startTime;
                    progress = Math.min(1, elapsed / duration);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    cameraTarget.lerpVectors(startTarget, endTarget, eased);
                    updateCamera();
                    if (progress < 1) {
                        requestAnimationFrame(animateCameraTarget);
                    }
                }
                animateCameraTarget();

                setTimeout(() => {
                    if (!isGameOver) {
                        spawnNewBlock();
                    }
                }, 150);
            }

            function createParticles(x, y, z, color, count = 10) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const velocities = [];

                for (let i = 0; i < count; i++) {
                    const px = x + (Math.random() - 0.5) * 0.8;
                    const py = y + (Math.random() - 0.5) * 0.8;
                    const pz = z + (Math.random() - 0.5) * 0.8;
                    positions[i*3] = px;
                    positions[i*3+1] = py;
                    positions[i*3+2] = pz;

                    velocities.push(new THREE.Vector3(
                        (Math.random() - 0.5) * 0.15,
                        Math.random() * 0.15 + 0.05,
                        (Math.random() - 0.5) * 0.15
                    ));
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: color,
                    size: 0.2,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const points = new THREE.Points(geometry, material);
                scene.add(points);

                particleSystems.push({
                    points: points,
                    velocities: velocities,
                    life: 1.0,
                    count: count
                });
            }

            function showPerfectEffect() {
                const badge = document.getElementById('perfect-badge');
                badge.style.opacity = '1';
                badge.style.transform = 'translate(-50%, -50%) scale(1.2)';
                setTimeout(() => {
                    badge.style.opacity = '0';
                    badge.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 500);

                if (combo > 1) {
                    const comboEl = document.getElementById('combo');
                    comboEl.textContent = `🔥 完美連擊 x${combo}`;
                    comboEl.style.opacity = '1';
                    setTimeout(() => {
                        comboEl.style.opacity = '0';
                    }, 800);
                }
            }

            function gameOver(fallingMesh) {
                isGameOver = true;
                isMoving = false;

                if (fallingMesh) {
                    fragments.push({
                        mesh: fallingMesh,
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.2,
                            -0.1 - Math.random() * 0.15,
                            (Math.random() - 0.5) * 0.2
                        ),
                        rotationSpeed: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.1,
                            (Math.random() - 0.5) * 0.1,
                            (Math.random() - 0.5) * 0.1
                        ),
                        life: 1.0
                    });
                }

                document.getElementById('final-score').textContent = score;
                document.getElementById('gameover').style.display = 'block';
                document.getElementById('instruction').style.opacity = '0';

                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('stack3dBest', bestScore);
                    document.getElementById('best').textContent = `最高分: ${bestScore}`;
                }
            }

            document.getElementById('best').textContent = `最高分: ${bestScore}`;

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (!isGameOver && isMoving) {
                        placeBlock();
                    }
                }
            });

            renderer.domElement.addEventListener('click', (e) => {
                if (!isGameOver && isMoving) {
                    placeBlock();
                }
            });

            document.getElementById('restart-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                initTower();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            let lastTime = performance.now();

            function animate() {
                requestAnimationFrame(animate);

                const delta = (performance.now() - lastTime) / 1000;
                lastTime = performance.now();

                if (isMoving && currentBlock && !isGameOver) {
                    const mesh = currentBlock.mesh;
                    const axis = currentBlock.axis;
                    const speed = currentBlock.speed;

                    if (axis === 'x') {
                        mesh.position.x += speed * 60 * delta;
                    } else {
                        mesh.position.z += speed * 60 * delta;
                    }

                    const topBlock = towerBlocks[towerBlocks.length - 1];
                    const topPos = topBlock.pos;
                    const dist = axis === 'x' ? Math.abs(mesh.position.x - topPos.x) : Math.abs(mesh.position.z - topPos.z);
                    const maxDist = currentBlock.maxDistance;

                    if (dist > maxDist) {
                        gameOver(mesh);
                    }
                }

                for (let i = fragments.length - 1; i >= 0; i--) {
                    const frag = fragments[i];
                    frag.mesh.position.x += frag.velocity.x * delta * 30;
                    frag.mesh.position.y += frag.velocity.y * delta * 30;
                    frag.mesh.position.z += frag.velocity.z * delta * 30;

                    frag.mesh.rotation.x += frag.rotationSpeed.x * delta * 30;
                    frag.mesh.rotation.y += frag.rotationSpeed.y * delta * 30;
                    frag.mesh.rotation.z += frag.rotationSpeed.z * delta * 30;

                    frag.velocity.y -= 0.008 * delta * 30;

                    frag.life -= 0.01 * delta * 30;

                    if (frag.mesh.material.transparent !== true) {
                        frag.mesh.material.transparent = true;
                    }
                    frag.mesh.material.opacity = Math.max(0, frag.life);

                    if (frag.life <= 0 || frag.mesh.position.y < -10) {
                        scene.remove(frag.mesh);
                        fragments.splice(i, 1);
                    }
                }

                for (let i = particleSystems.length - 1; i >= 0; i--) {
                    const ps = particleSystems[i];
                    const positions = ps.points.geometry.attributes.position.array;
                    for (let j = 0; j < ps.count; j++) {
                        positions[j*3] += ps.velocities[j].x * delta * 30;
                        positions[j*3+1] += ps.velocities[j].y * delta * 30;
                        positions[j*3+2] += ps.velocities[j].z * delta * 30;
                        ps.velocities[j].y -= 0.005 * delta * 30;
                    }
                    ps.points.geometry.attributes.position.needsUpdate = true;

                    ps.life -= 0.015 * delta * 30;
                    ps.points.material.opacity = Math.max(0, ps.life);

                    if (ps.life <= 0) {
                        scene.remove(ps.points);
                        particleSystems.splice(i, 1);
                    }
                }

                stars.rotation.y += 0.0001;

                if (!isDragging && !isGameOver && towerBlocks.length > 0) {
                    const topY = towerBlocks[towerBlocks.length - 1].pos.y;
                    const targetY = Math.max(4, topY + 4);
                    cameraTarget.y += (targetY - cameraTarget.y) * 0.02;
                    updateCamera();
                }

                renderer.render(scene, camera);
            }

            initTower();
            animate();
        }
    </script>
</body>
</html>
